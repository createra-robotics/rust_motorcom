[package]
name = "motorcom"
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Tony Wang"]
description = "Rust library for actuator motors (Damiao, Robstride, Unitree, ...)."
homepage = "https://createra.tech"
repository = "https://github.com/createra-robotics/rust_motorcom"
readme = "README.md"
keywords = ["robotics", "damiao", "robstride", "unitree", "can"]
categories = ["science::robotics", "embedded"]

[lib]
crate-type = ["lib", "cdylib"]

[features]
default           = ["socketcan-backend", "serial-backend"]
socketcan-backend = ["dep:socketcan"]
serial-backend    = ["dep:serialport"]
# Builds the cdylib as a Python extension module (pyo3) and enables the
# `stub_gen` binary that emits .pyi type stubs. CI builds wheels with this on.
python            = ["dep:pyo3", "dep:pyo3-stub-gen", "dep:pyo3-log"]

# Stub generator — only buildable with the `python` feature, since it uses
# pyo3 / pyo3-stub-gen. Run as: cargo run --bin stub_gen --features python
[[bin]]
name = "stub_gen"
required-features = ["python"]

[dependencies]
thiserror    = "2.0"
embedded-can = "0.4"

# Optional CAN backends
socketcan = { version = "3.5", optional = true }
# Optional serial backend (Unitree GO-M8010-6 RS485).
# `default-features = false` is critical: serialport's default feature set
# pulls in `libudev` (→ libudev-sys), which forces downstream crates and CI
# images without libudev-dev installed to fail at link time even when they
# never enable `serial-backend`. Re-enable specific serialport features here
# if/when the unitree RS485 transport actually needs them.
serialport = { version = "4.3", default-features = false, optional = true }
# Optional Python bindings
pyo3          = { version = "0.22", features = ["multiple-pymethods"], optional = true }
pyo3-log      = { version = "0.11", optional = true }
pyo3-stub-gen = { version = "0.6",  optional = true }

# Hint for rust-analyzer (VS Code, Helix, Neovim) so it analyzes the
# python-feature-only `stub_gen` bin and `src/python.rs` without flagging
# them as inactive. IntelliJ Rust / RustRover doesn't read this — set
# Settings → Languages & Frameworks → Rust → Cargo → "Use all features",
# or check the `python` feature in workspace.xml's <CargoProjects>.
[package.metadata.rust-analyzer]
cargo.features = "all"
